<style>
:root {
  color-scheme: light;
  --ground: #F2F3EF;
  --surface: #FBFBF8;
  --sunk: #E9EBE5;
  --ink: #1A1E1C;
  --muted: #5E6661;
  --faint: #8A928C;
  --rule: #D8DBD3;
  --accent: #2E5B4E;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1EBE6;
  --missed: #B42318;
  --missed-bg: #FBE9E7;
  --unsure: #8A5A00;
  --unsure-bg: #FBF1DC;
  --met: #2F6B3F;
  --met-bg: #E4F0E5;
  --prov: #5F5287;
  --prov-bg: #ECE9F3;
  --add: #E4F0E5;
  --del: #FBE9E7;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #111412; --surface: #181C1A; --sunk: #0D0F0E; --ink: #E4E7E2; --muted: #9AA39D;
    --faint: #6D766F; --rule: #2C322F; --accent: #8CC2AE; --accent-ink: #0E1512; --accent-soft: #1F2E28;
    --missed: #F0877B; --missed-bg: #3A1E1B; --unsure: #E3B75A; --unsure-bg: #33291A;
    --met: #86C497; --met-bg: #1C2E21; --prov: #B5A8DA; --prov-bg: #272336;
    --add: #1C2E21; --del: #3A1E1B;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #111412; --surface: #181C1A; --sunk: #0D0F0E; --ink: #E4E7E2; --muted: #9AA39D;
  --faint: #6D766F; --rule: #2C322F; --accent: #8CC2AE; --accent-ink: #0E1512; --accent-soft: #1F2E28;
  --missed: #F0877B; --missed-bg: #3A1E1B; --unsure: #E3B75A; --unsure-bg: #33291A;
  --met: #86C497; --met-bg: #1C2E21; --prov: #B5A8DA; --prov-bg: #272336;
  --add: #1C2E21; --del: #3A1E1B;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--sans); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--rule); padding-block: 20px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.brand { padding-inline: 20px; display: grid; gap: 2px; }
.brand b { font: 500 21px/1.1 var(--serif); letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 12px; }
.nav { display: grid; gap: 2px; padding-inline: 10px; }
.nav button { all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 6px; color: var(--muted); }
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav .count { font: 500 11.5px var(--mono); color: var(--muted); }
.who { margin-top: auto; padding-inline: 20px; display: grid; gap: 6px; }
.who select { font-size: 13px; }
.who label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
select, input[type="text"], textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { min-height: 64px; resize: vertical; }

main { padding: 28px 32px 64px; min-width: 0; display: grid; gap: 24px; align-content: start; max-width: 1180px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
.head h1 { margin: 0; font: 500 28px/1.15 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 64ch; }
.eyebrow { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); font-weight: 500; }

.banner { background: var(--unsure-bg); color: var(--ink); border: 1px solid var(--rule); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible { outline: 2px solid var(--accent); }

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.strip > div { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.strip b { font: 500 24px/1.1 var(--mono); }
.strip span { color: var(--muted); font-size: 12.5px; }
.strip .hot b { color: var(--missed); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; line-height: 18px; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-missed { background: var(--missed-bg); color: var(--missed); }
.p-met { background: var(--met-bg); color: var(--met); }
.p-cannot_confirm { background: var(--unsure-bg); color: var(--unsure); }
.p-not_measured, .p-provisional { background: var(--prov-bg); color: var(--prov); }
.p-not_applicable, .p-neutral { background: var(--sunk); color: var(--muted); }
.p-ratified { background: var(--accent-soft); color: var(--accent); }
.p-measured { background: var(--sunk); color: var(--ink); }
.tag { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; }

.group { display: grid; gap: 10px; }
.group > h2 { margin: 6px 0 0; font: 600 13px var(--sans); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.group > h2 small { font-weight: 400; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.card.sev { border-left: 3px solid var(--missed); }
.card.sev-u { border-left: 3px solid var(--unsure); }
.card.sev-p { border-left: 3px solid var(--prov); }
.card .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.card .summary { margin: 0; max-width: 88ch; }
.ref { all: unset; cursor: pointer; font: 500 12.5px var(--mono); color: var(--accent); border-bottom: 1px dotted currentColor; }
.ref:focus-visible { outline: 2px solid var(--accent); }
.ev { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); }
.ev a { font-family: var(--mono); font-size: 11.5px; }
.statement { font: 400 17px/1.45 var(--serif); margin: 0; max-width: 68ch; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 600px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 500; background: var(--surface); }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--sunk); }
td .sub { color: var(--muted); font-size: 12.5px; }

.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.detail { display: grid; gap: 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; }
.detail h3 { margin: 0; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 10.5px var(--mono); }
.list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; font-size: 13px; }

.btn { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 7px; font-weight: 500; font-size: 13px; border: 1px solid var(--rule); background: var(--surface); }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { font-size: 12.5px; color: var(--muted); }
.flag { font: 500 11px var(--mono); color: var(--missed); background: var(--missed-bg); border-radius: 4px; padding: 1px 6px; }
.diff { margin: 0; font: 12px/1.5 var(--mono); background: var(--sunk); border-radius: 8px; padding: 10px 0; overflow-x: auto; max-height: 420px; }
.diff span { display: block; padding-inline: 12px; white-space: pre; }
.diff .a { background: var(--add); }
.diff .d { background: var(--del); }
.diff .h { color: var(--muted); }
.change { display: grid; grid-template-columns: 1fr; gap: 6px; }
.change div { padding: 8px 10px; border-radius: 6px; font-size: 13px; }
.change .old { background: var(--del); }
.change .new { background: var(--add); }

.chain { display: flex; flex-wrap: wrap; gap: 12px; }
.col { display: grid; gap: 10px; align-content: start; flex: 1 1 170px; min-width: 0; }
.node a.mono, .node span.mono { overflow-wrap: anywhere; }
.col h4 { margin: 0; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
.node { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; font-size: 13px; }
.node.root { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.node .sys { font: 500 10.5px var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: .04em; }
.node .edges { display: grid; gap: 2px; font: 11px var(--mono); color: var(--muted); }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--rule); border-radius: 10px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px); }

@media (min-width: 1100px) {
  .split.two { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
  .split.two .detail { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 32px); overflow: auto; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding-block: 14px; gap: 12px; }
  .nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding-inline: 16px; }
  .brand, .who { padding-inline: 16px; }
  main { padding: 20px 16px 48px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .node { transition: border-color .15s; }
}

  p.state = m[2] === "accept" ? "accepted" : "rejected"; p.display_state = p.state;

  d.get["/api/audit"].unshift({ id: Date.now(), actor: me.email, action: "proposal_" + p.state, subject: "proposal:" + p.id, created_at: new Date().toISOString().slice(0, 19), detail: { note: "recorded in this browser tab only" } });
  const h = d.get["/api/overview"].health.proposal_acceptance;
  h.decided += 1; if (p.state === "accepted") h.accepted += 1; h.rate = h.accepted / h.decided;
  d.get["/api/overview"].health.open_proposals -= 1;
  return { id: p.id, state: p.state };
}

// --- Findings ---
const KIND = {

async function renderSpec() {
  const pk = state.product;
  const [clauses, enf] = await Promise.all([api("/api/clauses?product=" + pk), api("/api/enforcement?product=" + pk)]);
  const e = Object.fromEntries(enf.map((r) => [r.ref, r]));
  const prod = state.overview.products.find((p) => p.key === pk);
  const th = clauses.filter((c) => c.kind === "threshold");
  if (!state.clause && th.length) state.clause = (th.find((c) => c.status.verdict === "missed") || th[0]).ref;
  const ENF = { enforced: ["enforced", "p-met"], stricter: ["stricter in CI", "p-met"], latest_only: ["newest run only", "p-cannot_confirm"], none: ["not in CI", "p-missed"], expected_failure: ["expected failure", "p-missed"], partial: ["partial", "p-cannot_confirm"], looser: ["looser in CI", "p-missed"], no_metric: ["no metric", "p-provisional"] };
  let rows = th.map((c) => {
    const m = (c.status.metrics || [])[0];
    const en = e[c.ref] ? ENF[e[c.ref].state] : null;
    return `<tr class="click" data-ref="${c.ref}" ${state.clause === c.ref ? 'style="background:var(--accent-soft)"' : ""}>
      <td><span class="mono" style="white-space:nowrap">${c.ref}</span></td>
      <td>${esc(c.label)}<div class="sub">${esc(c.bar)}</div></td>
      <td class="num">${m ? `<span class="mono">${pct(m.latest, m.metric)}</span><div class="sub">${m.n ? "n=" + m.n : ""}</div>` : "<span class='sub'>none</span>"}</td>
      <td><div style="display:grid;gap:4px;justify-items:start"><span class="pill p-${c.status.verdict}">${verdictLabel[c.status.verdict]}</span><span class="pill p-${c.status.state}">${c.status.state}</span></div></td>
      <td>${en ? `<span class="pill ${en[1]}">${en[0]}</span>` : ""}</td></tr>`;
  }).join("");
  const others = ["contract", "rule", "hard_case", "non_goal"].map((k) => {
    const cs = clauses.filter((c) => c.kind === k); if (!cs.length) return "";
    const names = { contract: "Unacceptable failures", rule: "Rules", hard_case: "Known hard cases", non_goal: "Non-goals" };
    return `<details class="card"><summary><b>${names[k]}</b> <span class="note">${cs.length} clauses, held as text. Never reported as drift.</span></summary><ul class="list" style="margin-top:10px">${cs.map((c) => `<li><span class="mono">${c.ref}</span><span>${esc(c.statement)}</span></li>`).join("")}</ul></details>`;
  }).join("");

  <div class="split two"><div class="group"><div class="tbl-wrap"><table><thead><tr><th>Ref</th><th>Clause and bar</th><th>Latest</th><th>Verdict</th><th>CI</th></tr></thead><tbody>${rows}</tbody></table></div>${others}</div>${detail}</div>`;
}

async function clauseDetail(ref) {

    ${c.history.length ? `<div class="group"><h3>History</h3>${c.history.map((s) => chart(s, c)).join("")}</div>` : ""}

    ${c.proposals.length ? `<div class="group"><h3>Proposals</h3><ul class="list">${c.proposals.map((p) => `<li><span class="mono">#${p.id}</span><span class="pill p-neutral">${p.state}</span><span>${esc(p.reason)}</span></li>`).join("")}</ul></div>` : ""}
    <div class="group"><h3>Versions</h3><ul class="list">${c.versions.map((v) => `<li><span class="mono">v${v.version}</span><span class="tag">${v.status}</span><span class="note">${esc(v.approved_by)} ${esc((v.created_at || "").slice(0, 10))}</span></li>`).join("")}</ul></div>

function SNAP_BLOB() { return (SNAP && SNAP.blob) || "https://github.com/SurabhiDeb/chatbot-lab/blob/ef07ac9"; }

function chart(series, clause) {
  const pts = series.points; if (!pts.length) return "";
  const W = 560, H = 190, L = 44, R = 12, T = 12, B = 30;
  const vals = pts.map((p) => p.value).concat([clause.value, clause.value_high ?? clause.value]).concat(series.band || []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.12 || 0.05; lo = Math.max(0, lo - pad); hi = Math.min(1, hi + pad);
  const x = (i) => L + (pts.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1));
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = 4; let grid = "";
  for (let i = 0; i <= ticks; i++) { const v = lo + (hi - lo) * i / ticks; grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${pct(v, series.metric)}</text>`; }
  const band = series.source === "production" ? series.band : clause.comparator === "between" ? [clause.value, clause.value_high] : clause.comparator === ">=" ? [clause.value, hi] : null;
  const bandRect = band ? `<rect x="${L}" width="${W - L - R}" y="${y(Math.min(band[1], hi))}" height="${Math.max(0, y(Math.max(band[0], lo)) - y(Math.min(band[1], hi)))}" fill="var(--met-bg)"/>` : "";
  const barLine = series.source === "eval" ? `<line x1="${L}" x2="${W - R}" y1="${y(clause.value)}" y2="${y(clause.value)}" stroke="var(--met)" stroke-dasharray="4 3"/>` : "";
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const colour = (p) => p.verdict === "missed" ? "var(--missed)" : p.verdict === "cannot_confirm" ? "var(--unsure)" : series.source === "production" ? (series.band && (p.value < series.band[0] || p.value > series.band[1]) ? "var(--missed)" : "var(--met)") : "var(--met)";
  const dots = pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 3}" fill="${p.shipped === false ? "var(--surface)" : colour(p)}" stroke="${colour(p)}" stroke-width="1.5"><title>${esc(p.run)}  ${pct(p.value, series.metric)}${p.verdict ? "  " + verdictLabel[p.verdict] : ""}${p.shipped === false ? "  comparison run" : ""}</title></circle>`).join("");
  const marks = pts.map((p, i) => Object.keys(p.changed || {}).length && i ? `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}" stroke="var(--faint)" stroke-dasharray="1 3"/>` : "").join("");
  const first = pts[0].at.slice(5, 10), last = pts[pts.length - 1].at.slice(5, 10);
  return `<figure style="margin:0"><div class="note" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="mono">${esc(series.metric)}</span><span>${series.source === "production" ? "production, band from monitor" : "eval runs, dashed line is the bar"}</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.metric)} over ${pts.length} observations">${bandRect}${grid}${marks}${barLine}<path d="${line}" fill="none" stroke="var(--ink)" stroke-width="1.25" opacity=".55"/>${dots}
    <text x="${L}" y="${H - 10}">${first}</text><text x="${W - R}" y="${H - 10}" text-anchor="end">${last}</text></svg>
    <figcaption class="note">${pts.length} observations. Dotted verticals mark a change in a recorded version field. Hollow points are comparison runs outside the shipped config.</figcaption></figure>`;
}

async function renderInbox() {
  const all = await api("/api/proposals");
  const h = state.overview.health.proposal_acceptance;
  const list = all.filter((p) => state.inbox === "all" ? true : state.inbox === "open" ? p.state === "open" : p.state !== "open").filter((p) => !p.proposed_by.startsWith("seed"));
  const rate = h.rate == null ? "no decisions yet" : pct(h.rate);
  const inBand = h.rate != null && h.rate >= 0.5 && h.rate <= 0.85;
  let html = `<div class="head"><div><div class="eyebrow">Agent proposes, person decides</div><h1>Proposal inbox</h1><p>Nothing here changes the spec, a link, the eval suite or CI until a person accepts it. The critic scores each proposal and can reject it, and it never approves.</p></div>
    <div class="seg" role="group" aria-label="Filter">${[["open", "Open"], ["decided", "Decided"], ["all", "All"]].map(([k, l]) => `<button data-inbox="${k}" aria-pressed="${state.inbox === k}">${l}</button>`).join("")}</div></div>
    <div class="strip"><div><b>${list.length}</b><span>${state.inbox === "open" ? "waiting" : "shown"}</span></div><div class="${h.rate != null && !inBand ? "hot" : ""}"><b>${rate}</b><span>acceptance rate, healthy band 50% to 85%. ${h.decided} decided in this workspace.</span></div><div><b>${state.overview.health.audited_writes}</b><span>audited writes</span></div></div>`;
  if (h.rate != null && h.rate > 0.85) html += `<div class="banner">Acceptance is above 85%. Either the proposals are trivial or they are not being read. A rubber stamp on changes to the definition of correctness is worse than no tool.</div>`;
  if (!list.length) return html + `<div class="empty">Nothing ${state.inbox === "open" ? "waiting" : "here"}.</div>`;
  const KL = { clause_change: "Spec edit", new_clause: "New clause", link: "Link", eval_case: "Eval case", ci_change: "Pull request" };
  for (const p of list) {
    const flags = (p.flags || []).map((f) => `<span class="flag">${esc(f.replace("_", " "))}</span>`).join("");
    html += `<article class="card ${p.display_state === "open" ? "" : ""}" id="p${p.id}"><div class="top"><span class="mono">#${p.id}</span><span class="pill p-neutral">${KL[p.kind]}</span>${p.capability ? `<span class="tag">${esc(p.capability)}</span>` : ""}<span class="pill ${p.display_state === "open" ? "p-cannot_confirm" : p.display_state === "accepted" ? "p-met" : "p-missed"}">${esc(p.display_state.replace("_", " "))}</span>${flags}<span class="note">critic ${p.confidence}</span></div>
      <p class="summary"><b>${esc(targetLabel(p))}</b>. ${esc(p.reason)}</p>
      ${proposalBody(p)}
      ${evidence(p.evidence_links)}
      <p class="note" style="margin:0"><b>If rejected.</b> ${esc(p.if_rejected || "")}</p>
      ${(p.critic.notes || []).length ? `<p class="note" style="margin:0"><b>Critic notes.</b> ${esc(p.critic.notes.join("; "))}</p>` : ""}
      ${p.state === "open" ? decideControls(p) : `<p class="note" style="margin:0">${esc(p.state)} by ${esc(p.decided_by || "")}${p.decision_note ? ". " + esc(p.decision_note) : ""}</p>`}</article>`;
  }
  return html;
}
function targetLabel(p) {
  if (p.kind === "ci_change") return JSON.parse(p.new).title;
  if (p.kind === "eval_case") return "Add a case to " + p.target.split(":")[1];
  if (p.kind === "new_clause") return "Add clause " + p.field.split(":")[2];
  if (p.kind === "link") { const s = JSON.parse(p.new); return `Link ${s.from} ${s.type} ${s.to}`; }
  return `${p.target.replace("clause:", "")} ${p.target_label || ""}, field ${p.field}`;
}
function proposalBody(p) {
  if (p.kind === "ci_change") {
    const s = JSON.parse(p.new);
    const lines = s.diff.split("\n").map((l) => `<span class="${l.startsWith("+") && !l.startsWith("+++") ? "a" : l.startsWith("-") && !l.startsWith("---") ? "d" : l.startsWith("@@") ? "h" : ""}">${esc(l) || " "}</span>`).join("");
    return `${s.dry_run ? `<div class="banner">${esc(s.dry_run.summary)} ${s.dry_run.failing_runs.length ? "Runs: " + s.dry_run.failing_runs.map(esc).join(", ") + "." : ""}</div>` : ""}<details><summary class="note">Diff for <span class="mono">${esc(s.file)}</span> on branch <span class="mono">${esc(s.branch)}</span></summary><pre class="diff">${lines}</pre></details>`;
  }
  if (p.kind === "eval_case") { const c = JSON.parse(p.new); return `<div class="change"><div class="new"><span class="statement" style="font-size:15px">${esc(c.question)}</span><div class="note">${esc(c.audience)} audience. From traces ${c.source_traces.map(esc).join(", ")}. Expected status is left for a person to label.</div></div></div>`; }
  if (p.kind === "new_clause") { const c = JSON.parse(p.new); return `<div class="change"><div class="new"><span class="mono">${esc(c.ref)}</span> <span class="statement" style="font-size:15px">${esc(c.statement)}</span><div class="note">${esc(c.rationale)}</div></div></div>`; }
  if (p.kind === "clause_change") return `<div class="change">${p.old ? `<div class="old">${esc(p.old)}</div>` : `<div class="old note">No ${esc(p.field.replace("_", " "))} recorded.</div>`}<div class="new">${esc(p.new)}</div></div>`;
  return "";
}
function decideControls(p) {
  const roles = { clause_change: ["pm"], new_clause: ["pm"], link: ["pm"], eval_case: ["pm", "engineer"], ci_change: ["pm", "engineer"] };
  const can = roles[p.kind].includes(state.me.role);
  const blocked = p.display_state === "evidence_expired";
  return `<div class="actions"><button class="btn primary" data-accept="${p.id}" ${can && !blocked ? "" : "disabled"}>Accept</button><button class="btn" data-reject="${p.id}" ${can ? "" : "disabled"}>Reject</button>${can ? "" : `<span class="note">A ${state.me.role} cannot decide this.</span>`}</div>
    <div class="actions" id="rj${p.id}" hidden><label class="note" for="rr${p.id}">Why reject</label><input type="text" id="rr${p.id}" placeholder="One sentence the agent can learn from"><button class="btn" data-confirm-reject="${p.id}">Record rejection</button></div>`;
}
document.addEventListener("click", async (e) => {
  const f = e.target.closest("[data-inbox]"); if (f) { state.inbox = f.dataset.inbox; render(); return; }
  const a = e.target.closest("[data-accept]");
  const r = e.target.closest("[data-reject]");
  const c = e.target.closest("[data-confirm-reject]");
  try {
    if (a) { await api(`/api/proposals/${a.dataset.accept}/accept`, {}); toast(`Accepted #${a.dataset.accept}`); await refresh(); }
    if (r) { $("#rj" + r.dataset.reject).hidden = false; $("#rr" + r.dataset.reject).focus(); }
    if (c) { const why = $("#rr" + c.dataset.confirmReject).value.trim(); if (!why) { toast("Add a reason first."); return; } await api(`/api/proposals/${c.dataset.confirmReject}/reject`, { reason: why }); toast(`Rejected #${c.dataset.confirmReject}`); await refresh(); }
  } catch (err) { toast(err.message); }
});
async function refresh() { state.overview = await api("/api/overview"); renderNav(); render(); }

// --- Chain ---
const TYPE = { requirement: "Requirement", decision: "Decision", clause: "Clause", config_value: "Config", code_change: "Code", eval_metric: "Eval metric", prod_metric: "Production", ticket: "Ticket" };
async function renderChain() {
  if (!state.chainRoot) return `<div class="empty">No chain root in this workspace. Pick a clause in the spec.</div>`;
  const ch = await api(`/api/chain?key=${encodeURIComponent(state.chainRoot)}&depth=2`);
  if (ch.shape === "refusal") return `<div class="empty">${esc(ch.reason)}</div>`;
  const d = ch.data; const order = ["requirement", "decision", "clause", "config_value", "code_change", "ticket", "eval_metric", "prod_metric"];
  const edgesOf = (k) => d.edges.filter((e) => e.from_key === k).map((e) => `${e.link_type} → ${e.to_key.split(":")[1]}`);
  const cols = order.filter((t) => d.nodes.some((n) => n.type === t)).map((t) => `<div class="col"><h4>${TYPE[t]}</h4>${d.nodes.filter((n) => n.type === t).map((n) => {
    const s = n.status ? `<span class="pill p-${n.status.verdict}">${verdictLabel[n.status.verdict]}</span>` : "";
    const val = n.latest ? `<span class="mono">${pct(n.latest.value, n.ref.split("/")[1])}</span>${n.band ? ` <span class="note">band ${pct(n.band[0])} to ${pct(n.band[1])}</span>` : ""}` : "";
    return `<div class="node ${n.key === d.root ? "root" : ""}"><span class="sys">${esc(n.system || "")}</span><div>${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener" class="mono">${esc(n.ref)}</a>` : `<span class="mono">${esc(n.ref)}</span>`}</div><div>${esc(n.name)}</div>${n.bar ? `<div class="note">${esc(n.bar)}</div>` : ""}${s}${val}${edgesOf(n.key).length ? `<div class="edges">${edgesOf(n.key).map(esc).join("<br>")}</div>` : ""}${n.key !== d.root ? `<button class="btn" data-chain="${esc(n.key)}" style="justify-self:start;padding:3px 10px;font-size:12px">Center here</button>` : ""}</div>`;
  }).join("")}</div>`).join("");
  const roots = ["clause:TRI-11.2", "clause:PD-8.8", "requirement:REQ-44", "decision:SLK-0914"];
  return `<div class="head"><div><div class="eyebrow">Why does the product behave this way</div><h1>Requirement to evidence</h1><p>${esc(ch.statement)} ${d.complete ? "The chain resolves end to end." : esc(ch.caveats.join(" "))} No system on its own holds more than one of these links.</p></div>
    <div class="seg" role="group" aria-label="Start from">${roots.map((r) => `<button data-chain="${r}" aria-pressed="${state.chainRoot === r}">${r.split(":")[1]}</button>`).join("")}</div></div>
    <div class="strip"><div><b>${d.nodes.length}</b><span>records</span></div><div><b>${d.systems.length}</b><span>systems: ${d.systems.map(esc).join(", ")}</span></div><div><b>${d.edges.length}</b><span>typed links, each with an approval record</span></div></div>
    <div class="chain">${cols}</div><p class="note">Sources marked synthetic are demo stand-ins for Notion, Slack, Linear, Datadog and Langfuse. GitHub records point at the real chatbot-lab commit.</p>`;
}

// --- Tickets ---
async function renderTickets() {
  const t = await api("/api/tickets");
  if (t.shape === "refusal") return `<div class="empty">${esc(t.reason)}</div>`;
  const S = { blocked: "p-missed", clear: "p-met", cannot_determine: "p-cannot_confirm" };
  return `<div class="head"><div><div class="eyebrow">Ticket to acceptance criterion to clause to latest observation</div><h1>Which tickets are blocked</h1><p>${esc(t.statement)} ${esc((t.caveats || []).join(" "))}</p></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Ticket</th><th>State</th><th>Acceptance criteria</th></tr></thead><tbody>${t.data.map((r) => `<tr><td><a class="mono" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.ticket)}</a><div class="sub">${esc(r.title)}</div></td><td><span class="pill ${S[r.state]}">${esc(r.state.replace("_", " "))}</span></td><td><ul class="list">${r.acceptance_criteria.map((a) => `<li><span class="mono">${esc(a.id)}</span>${refBtn(a.clause)}<span class="pill p-${a.verdict}">${verdictLabel[a.verdict] || a.verdict}</span><span>${esc(a.text)}</span>${a.latest.map((l) => `<span class="mono note">${pct(l[1], l[0])}</span>`).join("")}</li>`).join("")}</ul></td></tr>`).join("")}</tbody></table></div>`;
}

// --- Audit ---
async function renderAudit() {
  const rows = await api("/api/audit");
  return `<div class="head"><div><div class="eyebrow">Append-only. Never updated, never deleted.</div><h1>Audit log</h1><p>Who proposed, who decided, when, and on what evidence. The newest 200 events.</p></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Subject</th></tr></thead><tbody>${rows.map((r) => `<tr><td class="mono">${esc((r.created_at || "").replace("T", " ").slice(0, 19))}</td><td class="mono">${esc(r.actor)}</td><td>${esc(r.action.replace(/_/g, " "))}</td><td class="mono" style="word-break:break-word">${esc(r.subject || "")}</td></tr>`).join("")}</tbody></table></div>`;
}

boot();
</script>

</body></html>
