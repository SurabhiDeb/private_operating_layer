[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    ac: maps a test to a PRD acceptance criterion
    hard_case: maps a test to a PRD B8 hard case
    edge_case: maps a test to a PRD A8 edge case
    story: maps a test to a PRD A7 user story
    needs_db: requires a live Postgres with the layer schema
